[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tkrzw-dict-agent"
version = "0.1.0"
description = "Read-only English-Japanese vocabulary sidecar for AI agents, built on Tkrzw-Dict"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
dependencies = [
  "regex",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: Japanese",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/Fuchi-JPN/tkrzw-dict-agent"
Repository = "https://github.com/Fuchi-JPN/tkrzw-dict-agent"
"Upstream (tkrzw-dict)" = "https://github.com/estraier/tkrzw-dict"
"Dictionary data" = "https://dbmx.net/dict/"

[project.optional-dependencies]
dev = ["pytest"]
api = ["fastapi", "uvicorn", "httpx"]

[project.scripts]
dict = "tkrzw_dict_agent.cli.main:main"
dict-server = "tkrzw_dict_agent.agent_api.server:main"

[tool.setuptools.packages.find]
include = ["tkrzw_dict_agent*"]

[tool.setuptools.package-data]
tkrzw_dict_agent = ["agent_api/*.json"]
