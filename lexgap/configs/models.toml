# Model registry.
#
# All models are served by the same single-model MLX runner (see
# runners.toml), which cannot hold two models at once.  Every entry therefore
# records the memory cost and whether the model was confirmed loadable, so a
# probe batch can be planned around serial model switching.
#
# Verified on 2026-09-22 against http://100.70.13.83:1234/v1.

[meta]
server          = "http://100.70.13.83:1234/v1"
metal_cap_gb    = 51.84
resident_gb     = 33.03
# Only one model fits at a time; switching means unloading the current one.
single_model    = true
verified_on     = "2026-09-22"

# ---------------------------------------------------------------------------
# Primary model for M1 (resolves Q-03).
# ---------------------------------------------------------------------------
[models."qwen3.8-27b-turbo-oq8e-1m"]
id        = "Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NM-DAU-mlx-oQ8e-1M"
family    = "Qwen3.8-27B"
quant     = "oQ8e"
ctx       = 1048576
role      = "primary"
resident  = true
loadable  = true
note      = "Q-03 answer. Reasoning model: probes must pass chat_template_kwargs={enable_thinking=false}. Answers a one-word prompt in 2 tokens with it, 200+ without."

# ---------------------------------------------------------------------------
# Quantization / pruning siblings for H4 (plan section 5, M3).
#
# Measured obstacle: none of the siblings could be loaded while the primary is
# resident -- each projected past the 51.84 GB Metal ceiling.  H4 therefore
# needs serial model switching, and the axis is not a clean BF16/Q8/Q4 triple
# of one checkpoint (see `h4_note`).
# ---------------------------------------------------------------------------
[models."qwen3.8-27b-mlx-6bit"]
id       = "Qwen3.8-27B-MLX-6bit"
family   = "Qwen3.8-27B"
quant    = "6bit"
ctx      = 262144
role     = "quantization-sibling"
resident = false
loadable = false
note     = "Loadable only after unloading the primary (projected 55.31GB)."

[models."qwen3.8-27b-huihui-abliterated-oq6e"]
id       = "Qwen3.8-27B-Huihui-Abliterated-oQ6e-MTP-MLX"
family   = "Qwen3.8-27B"
quant    = "oQ6e"
ctx      = 262144
role     = "quantization-sibling"
resident = false
loadable = false
note     = "Abliterated variant; projected 56.22GB, needs the primary unloaded."

[models."qwen3.8-flash-next-reap-288-4bit"]
id       = "Qwen3.8-Flash-Next-REAP-288-MLX-4bit"
family   = "Qwen3.8-Flash-Next"
quant    = "4bit"
pruning  = "REAP-288"
ctx      = 262144
role     = "degraded-candidate"
resident = false
loadable = false
note     = "Q-04 candidate: pruned model, a plausible stand-in for a degraded model. Projected 73.61GB."

[models."qwen3.8-flash-next-reap-384-4bit"]
id       = "Qwen3.8-Flash-Next-REAP-384-MLX-4bit"
family   = "Qwen3.8-Flash-Next"
quant    = "4bit"
pruning  = "REAP-384"
ctx      = 262144
role     = "degraded-candidate"
resident = false
note     = "Pairs with REAP-288 as a controlled pruning axis (fewer experts retained)."

[models."qwen3.8-flash-next-reap320-oq3e-dwq"]
id       = "Qwen3.8-Flash-Next-REAP320-oQ3e-DWQ-MTP-Vision-MLX"
family   = "Qwen3.8-Flash-Next"
quant    = "oQ3e-DWQ"
pruning  = "REAP-320"
ctx      = 262144
role     = "low-quantization"
