note     = "Different family and a much smaller context; the short context limits probe prompt length."

# ---------------------------------------------------------------------------
# H4 design note
# ---------------------------------------------------------------------------
[h4_note]
# H4 asks whether quantization level changes the vocabulary-gap curve.  The
# server does not offer BF16/Q8/Q4 of one identical checkpoint.  The two viable
# controlled axes are:
#   1. pruning ratio  -- REAP-288 vs REAP-384 (same method, same base)
#   2. bit width      -- oQ8e vs oQ6e vs oQ3e-DWQ across Qwen3.8 variants
# (1) is the cleaner experiment; (2) confounds fine-tuning with quantization
# and must be reported as such.
axis_recommended = "pruning ratio (REAP-288 vs REAP-384)"
axis_caveat      = "bit-width comparison mixes fine-tunes; report as confounded"
